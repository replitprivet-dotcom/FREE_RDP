name: Dual-Access-RDP-SSH
on: 
  workflow_dispatch:

jobs:
  # JOB 1: Windows RDP Access
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    
    steps:
    - name: Configure RDP
      run: |
        # Enable Remote Desktop
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        
        # Firewall rule for RDP
        netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
        netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
        
        # Restart RDP service
        Restart-Service -Name TermService -Force
        
        # Check if RDP is enabled
        $rdpStatus = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections"
        if ($rdpStatus.fDenyTSConnections -eq 0) {
          Write-Host "RDP enabled successfully!"
        } else {
          Write-Error "RDP enabling failed"
          exit 1
        }

    - name: Create RDP User
      run: |
        # Generate secure password
        Add-Type -AssemblyName System.Security
        $chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-='
        $password = -join ((1..20) | ForEach { Get-Random -Maximum $chars.Length | ForEach { $chars[$_] } })
        
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        
        # Create user
        New-LocalUser -Name "rdpuser" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
        
        # Add to groups
        Add-LocalGroupMember -Group "Administrators" -Member "rdpuser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue
        
        # Save credentials
        echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
        echo "RDP_USER=rdpuser" >> $env:GITHUB_ENV

    - name: Install Tailscale
      run: |
        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
        $installerPath = "$env:TEMP\tailscale.msi"
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
        Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
        Remove-Item $installerPath -Force

    - name: Connect Tailscale
      run: |
        & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-rdp-$env:GITHUB_RUN_ID
        
        # Get Tailscale IP
        $retries = 0
        $tsIP = $null
        while (-not $tsIP -and $retries -lt 15) {
          Start-Sleep -Seconds 5
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          $retries++
        }
        
        if ($tsIP) {
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"
        } else {
          Write-Error "Failed to get Tailscale IP"
          exit 1
        }

    - name: RDP Access Info
      run: |
        Clear-Host
        Write-Host "`n========================================="
        Write-Host "   🖥️  RDP ACCESS INFORMATION"
        Write-Host "========================================="
        Write-Host "Address: $env:TAILSCALE_IP:3389"
        Write-Host "Username: rdpuser"
        Write-Host "Password: $env:RDP_PASSWORD"
        Write-Host "========================================="
        Write-Host "`nUse Windows Remote Desktop Connection"
        Write-Host "or any RDP client to connect.`n"
        
        # Keep alive
        while ($true) {
          Write-Host "[$(Get-Date)] RDP Active - IP: $env:TAILSCALE_IP"
          Start-Sleep -Seconds 300
        }

  # JOB 2: Linux SSH Access (VPS)
  linux-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600
    
    steps:
    - name: Install SSH Server
      run: |
        # Install SSH
        sudo apt-get update
        sudo apt-get install -y openssh-server
        
        # Configure SSH
        sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
        
        # Additional settings
        sudo tee -a /etc/ssh/sshd_config > /dev/null <<EOT
        ClientAliveInterval 60
        ClientAliveCountMax 3
        AllowTcpForwarding yes
        X11Forwarding yes
        EOT
        
        # Start SSH service
        sudo systemctl enable ssh
        sudo systemctl start ssh
        sleep 2
        
        # Verify SSH is running
        if sudo systemctl is-active --quiet ssh; then
          echo "SSH started successfully!"
        else
          echo "SSH failed to start!"
          sudo systemctl status ssh --no-pager
          exit 1
        fi

    - name: Create SSH User
      run: |
        # Generate password
        PASSWORD=$(openssl rand -base64 24 | tr -d "=+/" | cut -c1-20)
        
        # Create user with sudo
        sudo useradd -m -s /bin/bash -G sudo sshuser
        
        # Set password
        echo "sshuser:$PASSWORD" | sudo chpasswd
        
        # Setup SSH directory
        sudo mkdir -p /home/sshuser/.ssh
        sudo chmod 700 /home/sshuser/.ssh
        sudo chown -R sshuser:sshuser /home/sshuser/.ssh
        
        # Save credentials
        echo "SSH_USER=sshuser" >> $GITHUB_ENV
        echo "SSH_PASSWORD=$PASSWORD" >> $GITHUB_ENV
        echo "SSH_CREDS=Username: sshuser | Password: $PASSWORD" >> $GITHUB_ENV

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sudo bash

    - name: Connect Tailscale
      run: |
        # Start Tailscale
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-ssh-$GITHUB_RUN_ID
        
        # Get IP
        sleep 10
        TS_IP=$(sudo tailscale ip -4)
        
        if [ -n "$TS_IP" ]; then
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"
        else
          echo "Failed to get Tailscale IP"
          exit 1
        fi

    - name: Verify SSH Access
      run: |
        # Test local SSH
        echo "Testing SSH locally..."
        ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no sshuser@localhost "echo 'SSH OK'"
        
        if [ $? -eq 0 ]; then
          echo "SSH service verified!"
        else
          echo "SSH verification failed!"
          sudo systemctl status ssh --no-pager
          exit 1
        fi

    - name: Install Tools (Optional)
      run: |
        sudo apt-get install -y htop vim tmux git curl wget net-tools dnsutils
        
        # Install Docker
        curl -fsSL https://get.docker.com -o get-docker.sh
        sudo sh get-docker.sh
        sudo usermod -aG docker sshuser
        
        # Install Node.js
        curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
        sudo apt-get install -y nodejs
        sudo npm install -g pm2

    - name: SSH Access Info
      run: |
        echo "========================================="
        echo "   🔐 SSH VPS ACCESS INFORMATION"
        echo "========================================="
        echo "IP: ${{ env.TAILSCALE_IP }}"
        echo "Port: 22"
        echo "Username: ${{ env.SSH_USER }}"
        echo "Password: ${{ env.SSH_PASSWORD }}"
        echo "========================================="
        echo ""
        echo "Connect using:"
        echo "ssh ${{ env.SSH_USER }}@${{ env.TAILSCALE_IP }}"
        echo ""
        echo "Password: ${{ env.SSH_PASSWORD }}"
        echo ""
        echo "========================================="
        
        # Show service status
        sudo systemctl status ssh --no-pager
        
        # Keep alive
        while true; do
          echo "[$(date)] SSH VPS Active - IP: ${{ env.TAILSCALE_IP }}"
          echo "ssh ${{ env.SSH_USER }}@${{ env.TAILSCALE_IP }}"
          sleep 300
        done
